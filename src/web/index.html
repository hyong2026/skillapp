<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <script src="/theme-boot.js"></script>
  <title>SkillApp</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- 整页刷新时的首屏遮罩：由 CSS 立刻盖住，第一屏画完由 app.js 淡出移除。 -->
  <div class="boot" id="boot" role="status" aria-label="Loading"><span class="spinner" aria-hidden="true"></span></div>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo brand-logo-dark" src="/logo.svg" alt="">
      <img class="brand-logo brand-logo-light" src="/logo-light.svg" alt="">
      <strong>SkillApp</strong>
    </div>
    <nav class="nav" id="mainNav" aria-label="Main navigation">
      <a href="#home" data-route="home">Home</a>
      <a href="#skills" data-route="skills">Skills</a>
      <a href="#templates" data-route="templates">Templates</a>
      <a href="#runs" data-route="runs">Runs</a>
      <a href="#operations" data-route="operations">Operations</a>
      <a href="#settings" data-route="settings">Settings</a>
    </nav>
    <section class="messages" id="messages" aria-label="Messages" hidden></section>
  </header>

  <main class="page">
    <div id="viewHead" class="page-head"></div>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <section id="app" class="page-body" aria-live="polite"></section>
  </main>

  <noscript>This page requires JavaScript.</noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
